document.fonts.ready.then(()=>{
  const issues=[];
  document.querySelectorAll('.row.focus,.event.focus,.modal,.actions,.tabs,.controls,.header-actions,.header-action-label,.inspector,.heading').forEach(node=>{
    const r=node.getBoundingClientRect(),c=document.getElementById('screen').getBoundingClientRect();
    if(r.left<c.left||r.top<c.top||r.right>c.right+1||r.bottom>c.bottom+1)issues.push(node.className+': outside canvas');
  });
  document.querySelectorAll('.button,.control,.tab,.modal').forEach(node=>{
    if(node.scrollWidth>node.clientWidth+2||node.scrollHeight>node.clientHeight+2)issues.push(node.className+': clipped content');
  });
  document.body.dataset.audit=JSON.stringify(issues);
});
</script>
</html>
