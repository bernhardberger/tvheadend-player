  document.getElementById('notes').textContent=scene.note+'\n\nGrid overlay: physical 12-column grid, pane axes, y492 fade boundary and y508 passive footer. Focus extends outside nominal pane edges. Synthetic data/artwork/picons · Oct 3, 2026, 20:10 UTC · opaque no-video background. Native focus, transitions, key cycles, eligibility, translations, playback and physical-TV readability are not tested by this study.';
  fit();
}
function updateUrl(){const params=new URLSearchParams(location.search);params.set('scene',selector.value);if(gridControl.checked)params.set('grid','1');else params.delete('grid');history.replaceState(null,'','?'+params);}
selector.addEventListener('change',()=>{show(selector.value);updateUrl();});
gridControl.addEventListener('change',()=>{show(selector.value);updateUrl();});
new ResizeObserver(fit).observe(document.getElementById('viewport'));
window.gridStudy={scenes:scenes.map(({id,name,destination,large=false,expanded=false,note})=>({id,name,destination,fontScale:large?1.3:1,locale:large?'de-DE':'en-US',expanded,note})),show,tree};
show(query.get('scene'));
document.fonts.ready.then(()=>show(selector.value));
